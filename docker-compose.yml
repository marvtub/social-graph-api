services:
  backend:
    build: ./server
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    volumes:
      - server-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/v1/health"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  server-data:
